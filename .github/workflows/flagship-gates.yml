name: Flagship Gates (RELEASE_BLOCKING)
# ---------------------------------------------------------------------------
# PURPOSE
# -------
# Runs the RELEASE_BLOCKING slow gates that cannot fit on GitHub-hosted runners
# in the normal push/PR CI window.  Two lanes:
#
#   scheduled  — nightly (00:30 UTC) on ubuntu-latest.  Best-effort: if GitHub
#                billing is paused the run simply never triggers.  Local/self-
#                hosted runs remain the primary gate (see CONTRIBUTING.md).
#
#   workflow_dispatch — manual trigger for maintainer validation runs.
#                       Supports an optional `runner` input to target a self-
#                       hosted machine (e.g. the i7-12700K bench host).
#
# GATES COVERED
# -------------
# Pattern A  (#![cfg(feature="slow-tests")], no #[ignore])
#   Runs via: cargo run -p xtask -- test-flagship
#   G3⁶-2D         convergence_rate_6th_2d       (strang 6th-order 2-D slope)
#   G4_NS2D_aniso  strang_nonseparable_aniso_slope (non-separable aniso slope)
#   G5_3D          strang_3d_slope               (3-D tensor-product slope)
#
# Pattern B  (#[ignore], optional slow-tests feature)
#   Runs via: cargo test --workspace --features parallel,simd,slow-tests
#             --release -- --ignored --nocapture
#   G17            g17_magnus6_slope             (MagnusGraph 6th-order)
#   G18            g18_schrodinger_unitarity     (Schrödinger slope part)
#   G_zeta4_TRUTHFUL_ORDER  zeta4_truthful_order  (ζ⁴ true-order gate)
#   G_zeta6_TRUTHFUL_ORDER  zeta6_truthful_order  (ζ⁶ true-order gate, ADR-0119)
#   G_zeta8_TRUTHFUL_ORDER  zeta8_truthful_order  (ζ⁸ true-order gate, ADR-0119)
#   G_zeta4        zeta4_correction_slope        (ζ⁴ correction slope)
#   G_zeta4_cheb   zeta4_correction_slope_cheb   (ζ⁴ Chebyshev variant)
#   G_zeta6        zeta6_correction_slope        (ζ⁶ correction slope)
#   G_zeta6_cheb   zeta6_correction_slope_cheb   (ζ⁶ Chebyshev variant)
#   G_zeta8        zeta8_correction_slope        (ζ⁸ correction slope)
#   G_DDIM (D=2-5) anisotropic_shift_nd_d{2..5}_slope  (d-D aniso gates)
#   hormander_*    hormander_{engel,heisenberg,kolmogorov}_slope  (Hörmander)
#   robin_heat_slope (Robin boundary order gate)
#   subordinated_order1_slope  (subordinated semigroup)
#
# L-gate:
#   L_CEV_PTICK  latency-gate (blocking per ADR-0069; requires bench hardware)
#
# RUNNER NOTES
# ------------
# GitHub-hosted ubuntu-latest runners have ~2 vCPU / 7 GB RAM.  Most Pattern A
# flagship gates run 10-30 min on 12-core hardware; on hosted runners they may
# take 60-120 min or hit the 6-h job limit.  The latency-gate (L_CEV_PTICK)
# requires prod hardware to produce meaningful p99.9 measurements.
#
# If you run on a self-hosted i7-12700K runner, set the `runner` input to
# `self-hosted` (or your runner label) when triggering workflow_dispatch.
#
# FAILURE SEMANTICS
# -----------------
# continue-on-error: false  →  a failing gate fails the job and the workflow.
# This is intentional: these are RELEASE_BLOCKING gates.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Nightly at 00:30 UTC (offset from midnight to avoid GitHub queue peak).
    - cron: "30 0 * * *"
  push:
    # Release tags. Before this trigger existed, the flagship gates ran ONLY on
    # the nightly schedule, so a tag pushed between two nightlies was published
    # with no flagship evidence bound to its SHA at all — v0.13.0-beta shipped
    # that way (its last flagship run predated the whole issue campaign).
    #
    # This lane is a RECORD, not a blocker: it does NOT gate release-crate.yml /
    # release-wheels.yml / release-wasm.yml, which publish in minutes while this
    # workflow takes 83-118 min on hosted runners. Making publication wait on it
    # would trade a fast release for a 2 h stall plus a 6 h-timeout failure mode
    # that blocks the release entirely. The actual pre-tag gate remains the local
    # run on production hardware (docs/release-process.md step 3); this trigger
    # guarantees an auditable run exists against the exact released commit, and a
    # red result here is grounds to yank and patch.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-latest or self-hosted)"
        required: false
        default: "ubuntu-latest"

jobs:
  # ---------------------------------------------------------------------------
  # Pattern A: flagship slope gates (slow-tests feature, named test binaries)
  # cargo run -p xtask -- test-flagship handles this cleanly.
  # ---------------------------------------------------------------------------
  flagship-slope-gates:
    name: Flagship slope gates (G3⁶-2D, G4_NS2D_aniso, G5_3D)
    # Use the runner input when dispatch; fall back to ubuntu-latest for schedule.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run flagship slope gates
        # test-flagship wraps: RUSTFLAGS="-C target-cpu=native"
        #   cargo test --workspace --features parallel,simd,slow-tests --release
        #   --test convergence_rate_6th_2d
        #   --test strang_nonseparable_aniso_slope
        #   --test strang_3d_slope
        #   --no-fail-fast -- --nocapture
        run: cargo run -p xtask -- test-flagship
        env:
          # Ensure RUSTFLAGS propagates correctly even if xtask sets it internally.
          RUSTFLAGS: "-C target-cpu=native"

  # ---------------------------------------------------------------------------
  # Pattern A (continued): d-D anisotropic shift gates (D=2..5)
  # These are #![cfg(feature="slow-tests")] at file level; no #[ignore].
  # ---------------------------------------------------------------------------
  anisotropic-ddim-gates:
    name: d-D anisotropic slope gates (G_DDIM D=2-4)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # D=5 is NOT here — it runs in nightly.yml. `K^D` sampling (ADR-0191)
      # makes it a ~4.9 h single test at the normative `N_AXIS = 6`, which is
      # most of a 6 h runner budget for one gate. D=2..4 together run in ~20 min.
      - name: Run G_DDIM gates (D=2, D=3, D=4)
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test anisotropic_shift_nd_d2_slope \
            --test anisotropic_shift_nd_d3_slope \
            --test anisotropic_shift_nd_d4_slope \
            --no-fail-fast -- --nocapture

  # ---------------------------------------------------------------------------
  # Pattern B: ignored gates — need BOTH --features slow-tests AND -- --ignored.
  # Grouped by concern so a failure identifies the culprit area.
  # ---------------------------------------------------------------------------

  zeta-truthful-order-gates:
    name: ζ truthful-order gates (zeta4/6/8 RELEASE_BLOCKING)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ζ truthful-order and correction-slope gates
        # These tests carry #[ignore] so -- --ignored is required in addition to
        # --features slow-tests (which may be needed for type-level compilation).
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test zeta4_truthful_order \
            --test zeta6_truthful_order \
            --test zeta8_truthful_order \
            --test zeta4_correction_slope \
            --test zeta4_correction_slope_cheb \
            --test zeta6_correction_slope \
            --test zeta6_correction_slope_cheb \
            --test zeta8_correction_slope \
            --no-fail-fast -- --ignored --nocapture

  magnus-schrodinger-gates:
    name: Magnus6 + Schrödinger slope gates (G17, G18)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run G17 (MagnusGraph 6th-order) and G18 (Schrödinger slope)
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test g17_magnus6_slope \
            --test g18_schrodinger_unitarity \
            --no-fail-fast -- --ignored --nocapture

  hormander-quantum-gates:
    name: Hörmander + quantum graph slope gates
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Hörmander (Engel, Heisenberg, Kolmogorov) and quantum-graph gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test hormander_engel_slope \
            --test hormander_heisenberg_slope \
            --test hormander_kolmogorov_slope \
            --test quantum_graph_eigenmode \
            --no-fail-fast -- --ignored --nocapture

  misc-slow-gates:
    name: Remaining slow gates (Robin, subordinated, resolvent)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Robin boundary, subordinated, and resolvent slope gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test robin_heat_slope \
            --test subordinated_order1_slope \
            --no-fail-fast -- --ignored --nocapture

  # ---------------------------------------------------------------------------
  # Pattern C: the gate sweep.
  #
  # WHY THIS EXISTS
  # ---------------
  # Audited 2026-08-18: `properties.yaml` declares 117 RELEASE_BLOCKING gates.
  # Before these jobs, they were executed as follows —
  #
  #     35  plain `cargo test --workspace --release`  (ci.yml)
  #     16  named `--test` binaries in this file / nightly.yml
  #      2  Python, via py-smoke
  #     59  NOTHING. No workflow ran them, on any trigger.
  #      4  marker entries with no test_file
  #
  # The 59 were unreachable in two different ways, and the second is the one
  # that reads as healthy: 27 files are `#![cfg(feature = "slow-tests")]`, so
  # CI never even compiled them; the rest carry `#[ignore]`, so CI compiled and
  # ran the binary and then SKIPPED the gate, reporting it in the `N ignored`
  # tally of a green run.
  #
  # The formal safety net was `xtask test-full` + `test-ignored-gates`, run by
  # hand before a tag (docs/release-process.md steps 3a/4). It depends on a
  # human remembering, and before v0.13.0-beta it did not happen — which is how
  # gates written FOR the v0.13.0-beta issue campaign (G_ASND_MOMENT, the
  # second-moment gate written to catch issue #17; the five G_CONS_* gates for
  # #26; G_SHIFT1D_COEFF_FD for #25; G_PENCIL_ORDER2 for #21) shipped without
  # ever having executed in CI.
  #
  # These jobs bind that set to both triggers of this workflow: nightly, and
  # every `v*` tag. Grouped by concern so a red job names the culprit area,
  # matching the Pattern B style above. `--include-ignored` runs both the
  # `#[ignore]`d gates and the plain tests in the same binaries, so a file does
  # not need to be classified by gating mechanism to be covered here.
  #
  # timeout-minutes is a runaway guard, not a tight budget. Local wallclock was
  # measured on a 12-core host on 2026-08-18 (the first execution most of these
  # gates ever had): the overwhelming majority finish in 11-20 s each, the
  # slowest survivors being g_killing_order2 at 90 s and g_kahler_curv at 50 s.
  # Hosted runners are ~6x slower, so the guards below sit far above expectation
  # on purpose. The two genuine outliers found by that measurement —
  # G_SMOLYAK_D5 and G_SMOLYAK_D6 — were moved to nightly.yml rather than
  # absorbed into a guard here. Tighten from the first green nightly.
  # ---------------------------------------------------------------------------

  campaign-gates:
    name: Issue-campaign gates (#17, #21, #25, #26)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # G_ASND_MOMENT (#17 regression oracle), G_CONS_* ×5 (#26 degenerate
      # faces), G_SHIFT1D_COEFF_FD (#25 coefficient VJP), G_PENCIL_ORDER2
      # (#21 transverse-varying pencils), G_FROZEN_COEFF_* ×2.
      - name: Run issue-campaign gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test aniso_nd_moment \
            --test conservative_gates \
            --test shift1d_vjp_gates \
            --test strang2d_pencil_gates \
            --test frozen_coeff_operator \
            --no-fail-fast -- --include-ignored --nocapture

  operator-exponential-gates:
    name: Operator / matrix-exponential gates
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # G_GRAPH_EXPMV_*, G_GRAPH_FRECHET_FD, G_SYMOP_ENTRY_FRECHET, G_MASSK_*,
      # G_PHI_AUG_DENSE, G_ETDRK4_ORDER, G_ETD_ADJOINT_FD, G_MATRIX_2D/3D,
      # G_MATRIX_PADE_M5, G_CPLX_MATRIX, and G_MATRIX (m1..m4 slope ladder,
      # which properties.yaml records via the brace shorthand
      # `matrix_diffusion_m{1,2,3,4}_slope.rs`).
      - name: Run operator and matrix-exponential gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test graph_expmv_dense \
            --test graph_expmv_depth_flat \
            --test graph_frechet_fd \
            --test sym_op_entry_frechet \
            --test massk_lumped \
            --test massk_consistent \
            --test g_phi_aug_dense \
            --test g_etdrk4_order \
            --test g_etd_adjoint_fd \
            --test expmv_div_form_action_accuracy \
            --test g_matrix_2d3d \
            --test g_matrix_pade_m5 \
            --test g_cplx_matrix \
            --test matrix_diffusion_m1_slope \
            --test matrix_diffusion_m2_slope \
            --test matrix_diffusion_m3_slope \
            --test matrix_diffusion_m4_slope \
            --no-fail-fast -- --include-ignored --nocapture

  geometry-hypoelliptic-gates:
    name: Geometry / manifold / hypoelliptic gates
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # G_KAHLER_CURV, G_CARNOT_CPLX3, G26 (sphere), G23 + G_KILLING_ORDER2,
      # G27 (reflected half-line), G25 (Howland lift), G_HARD_WALL_ORDER2,
      # G_QSCHROD, G_SCHROD_B.
      - name: Run geometry and hypoelliptic gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test g_kahler_curv \
            --test g_carnot_cplx3_slope \
            --test manifold_sphere_slope \
            --test killing_dirichlet_slope \
            --test g_killing_order2 \
            --test reflected_heat_halfline \
            --test howland_lift_slope \
            --test g_hard_wall_order2 \
            --test g_qschrod \
            --test schrodinger_complex_unitarity \
            --no-fail-fast -- --include-ignored --nocapture

  resolvent-sampling-gates:
    name: Resolvent / sampling-floor / sparse-grid gates
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # G_RESOLVENT_JUMP_{,,2D_,3D_}ORDER, G_RES_RES, G_CPLX_RES,
      # G_PATH_EPS_FLOOR, G_PATH_EPS_CHEB_FLOOR, G_POINTEVAL, G_AS_K,
      # G_AS_ZETA2_DDIM.
      #
      # G_SMOLYAK_D5 / G_SMOLYAK_D6 are NOT here — they moved to the
      # `smolyak-d5-d6` job in nightly.yml. Measured 2026-08-18 on a 12-core
      # host, the first execution either has ever had: D=5 exceeded a 40 min
      # cap and D=6 is the same order. The files claim "~10-30 s on release",
      # a figure that predates ADR-0191's `K^D` sampler (1024 node reads per
      # sample at D=5 against multilinear's 32). Left in this job they would
      # dominate it and, on a 2-vCPU hosted runner, put the tag lane at risk of
      # the 6 h job limit.
      - name: Run resolvent, sampling-floor and sparse-grid gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test g_resolvent_jump_order \
            --test g_resolvent_jump_2d_order \
            --test g_resolvent_jump_3d_order \
            --test laplace_resolvent_residual \
            --test g_cplx_res \
            --test path_eps_spatial_floor \
            --test path_eps_chebyshev_floor \
            --test point_eval_byte_identity \
            --test approximation_subspace \
            --test g_as_zeta2_ddim \
            --no-fail-fast -- --include-ignored --nocapture

  wentzell-multilayer-ad-gates:
    name: Wentzell / multilayer / AD gates
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # G_WENTZELL_{STABLE,ORDER}, G_TPS_* ×4 (multilayer stack),
      # G_DUAL_AD_GRADIENT, G_DUAL_ZERO_ALLOC, G_ADJOINT_FP_ORDER +
      # G_ADJOINT_FP_TIGHTNESS_VAGUE, G_DR_ZETA4_TRUTHFUL_ORDER.
      - name: Run Wentzell, multilayer and AD gates
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test g_wentzell_stable \
            --test g_wentzell_order \
            --test multilayer_gates \
            --test dual_ad_gradient \
            --test dual_zero_alloc \
            --test g_adjoint_fp_order \
            --test g_dr_zeta4_truthful_order \
            --no-fail-fast -- --include-ignored --nocapture

  nonseparable-2d-gates:
    name: Non-separable 2-D slope gates (G3_NS2D, G3_NS2D_var)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Given its own job: this binary fixes N=1000 Chernoff steps and sweeps
      # the spatial grid, the same shape as `strang_nonseparable_aniso_slope`
      # in the flagship job, which measures 118 min on a hosted runner. Sharing
      # a job with the short gates above would let one slow binary time out the
      # whole group and hide their results.
      - name: Run G3_NS2D and G3_NS2D_var
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test --workspace \
            --features parallel,simd,slow-tests --release \
            --test strang_nonseparable_slope \
            --no-fail-fast -- --include-ignored --nocapture


  # ---------------------------------------------------------------------------
  # L-gate: latency floor (L_CEV_PTICK — RELEASE_BLOCKING, ADR-0069).
  #
  # NOTE: meaningful p99.9 measurements require dedicated prod hardware
  # (i7-12700K or equivalent with governor=performance).  On a GitHub-hosted
  # runner the bench output is valid but the absolute floor values are calibrated
  # for the self-hosted machine — the gate will emit L-GATE WARN (no matching
  # profile) rather than a hard failure, which is the correct advisory behaviour
  # for a hosted runner.  To run the blocking check, trigger with runner=self-hosted.
  # ---------------------------------------------------------------------------
  latency-gate:
    name: L-gate (L_CEV_PTICK latency floor, ADR-0069)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (required by latency-gate bench invocation)
        run: cargo build --release -p semiflow
        env:
          RUSTFLAGS: "-C target-cpu=native"
      - name: Run latency gate (L_CEV_PTICK)
        # On hosted runners: emits L-GATE WARN (no i7-12700K profile match) and
        # exits 0 — advisory behaviour is correct per latency_gate.rs is_advisory().
        # On self-hosted i7-12700K: runs with advisory=false, exits 1 on breach.
        run: cargo run -p xtask -- latency-gate --all
        env:
          RUSTFLAGS: "-C target-cpu=native"
