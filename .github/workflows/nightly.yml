name: Nightly diff-scipy
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:

jobs:
  diff-scipy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install scipy numpy
      - run: cargo test --release -p semiflow --features diff-scipy --test diff_scipy

  ddim-d5:
    name: G_DDIM D=5 (RELEASE_BLOCKING, ~5 h)
    runs-on: ubuntu-latest
    # 350, not 420: a hosted job is killed at 6 h whatever this says. The gate
    # itself measures ~4.9 h, so it fits — but only just.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Moved out of flagship-gates.yml: at the normative `N_AXIS = 6` this one
      # test costs ~4.9 h, most of a 6 h runner budget. The gate itself is
      # unchanged and still RELEASE_BLOCKING — it just cannot share a job with
      # gates that need to answer in minutes. See ADR-0191 AMENDMENT 5.
      - name: Run G_DDIM D=5
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test -p semiflow \
            --features parallel,simd,slow-tests --release \
            --test anisotropic_shift_nd_d5_slope -- --nocapture

  smolyak-d5:
    name: G_SMOLYAK_D5 (RELEASE_BLOCKING, hours)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One gate per job, deliberately. Both Smolyak gates exceeded a 40 min cap
      # on a 12-core host — the first measurement either has ever had, since
      # neither ran in any workflow before 2026-08-18. A hosted runner is ~6x
      # slower, so each is a multi-hour job on its own and the two of them
      # sharing a runner would exceed the 6 h hosted limit and be killed with
      # neither result recorded.
      #
      # timeout-minutes is 350, not 420: GitHub caps a hosted job at 6 h
      # regardless of this value, so a larger number would only misdescribe the
      # budget. See the `#jobsjob_idtimeout-minutes` note in the workflow-syntax
      # docs.
      #
      # Cause of the cost, for the record: ADR-0191 replaced multilinear N-D
      # sampling with the `K^D` tensor stencil, so a D=5 sample reads 1024 nodes
      # against multilinear's 32. ADR-0191 measured that 32x on the D=5 Smolyak
      # smoke tests (70 s -> 198 s, which is why those were re-sized) and left
      # this gate alone; the file header still claimed "~10-30 s on release"
      # until this campaign corrected it.
      - name: Run G_SMOLYAK_D5
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test -p semiflow \
            --features parallel,simd,slow-tests --release \
            --test g_smolyak_d5 -- --include-ignored --nocapture

  smolyak-d6:
    name: G_SMOLYAK_D6 (RELEASE_BLOCKING, hours)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Split from D=5 for the reason given there: each is multi-hour on a
      # hosted runner and the pair would not fit in one 6 h job.
      - name: Run G_SMOLYAK_D6
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test -p semiflow \
            --features parallel,simd,slow-tests --release \
            --test g_smolyak_d6 -- --include-ignored --nocapture

  nonseparable-2d:
    name: G3_NS2D / G3_NS2D_var (RELEASE_BLOCKING, hours)
    runs-on: ubuntu-latest
    # 350, not 420: a hosted job is killed at 6 h whatever this says.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Third gate found to be hours-long by the 2026-08-18 sweep, and like the
      # two above it had never executed in any workflow, so its cost had never
      # been measured. It exceeded a 40 min cap on a 12-core host.
      #
      # For scale: its sibling `strang_nonseparable_aniso_slope` — same shape,
      # fixed N=1000 Chernoff steps with a spatial sweep — measures 118 min on a
      # hosted runner and IS on the tag lane in flagship-gates.yml. This binary
      # is at least twice that sibling's local cost, which projects past 4 h on
      # a hosted runner and uncomfortably close to the 6 h job limit. That is
      # why it sits here on the nightly schedule rather than on the tag lane.
      #
      # No regression is implied: the gate is simply expensive by construction.
      - name: Run G3_NS2D and G3_NS2D_var
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo test -p semiflow \
            --features parallel,simd,slow-tests --release \
            --test strang_nonseparable_slope \
            --no-fail-fast -- --include-ignored --nocapture

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      # Miri approach: scalar path, std enabled, libm asm disabled.
      # --no-default-features strips the `simd` default feature whose AVX2
      # intrinsics (_mm256_*) are not supported by Miri at runtime.
      # --features std re-enables std so the libtest harness can allocate.
      # --features libm/force-soft-floats disables libm's x86 SSE2 inline-asm
      # sqrt path (sqrtsd), replacing it with libm's pure-Rust fallback; without
      # this flag libm-0.2.16 still emits "unsupported operation: inline assembly"
      # even on the scalar path.
      # -Zmiri-strict-provenance enforces strict pointer-provenance rules.
      # -Zmiri-disable-isolation allows proptest's getcwd()/filesystem access
      # for shrinking / replay; this is not a provenance bypass.
      #
      # Why scoped filters instead of the full test suite
      # ---------------------------------------------------
      # The crate root carries `#![deny(unsafe_code)]`; the only real `unsafe`
      # lives in the `simd` module which is excluded here by
      # `--no-default-features`.  Running all ~608 lib unit tests (including
      # large proptest suites, 6th-order Chernoff sweeps, etc.) under Miri's
      # 10-100× slowdown buys no additional UB coverage on pure-safe numerics
      # and has caused the job to time out at 2 h+.
      #
      # Test filters (libtest ORs multiple positional args after `--`):
      #
      #   "scratch"         — 4 ScratchPool tests covering borrow/drop/return
      #                       lifecycle and the ScratchVec RAII guard.  These
      #                       exercise Vec::resize, core::mem::swap in Drop, and
      #                       the free-list push/pop — the highest-density
      #                       provenance surface in the scalar crate path.
      #
      #   "preserves_shape" — 3 tests (axis::apply_x_preserves_shape,
      #                       axis::apply_y_preserves_shape, and
      #                       strang2d::apply_preserves_shape) that drive
      #                       apply_into_via_view.  That function calls
      #                       ScratchPool::take_vec/return_vec and iterates
      #                       disjoint 2D grid-row chunks — the main slice-
      #                       aliasing exercise for the axis-lifting split-borrow
      #                       code path.
      #
      # Verified locally: 7 tests pass, ~30 s wall-clock.
      # If Miri gains stable SIMD-intrinsic support in future, re-enable with
      # `--features simd` and remove `libm/force-soft-floats`.
      - name: Run Miri — scalar path, scoped to memory-safety-relevant tests
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
        run: >-
          cargo +nightly miri test -p semiflow --lib
          --no-default-features --features "std,libm/force-soft-floats"
          -- scratch preserves_shape

  bench-regression:
    name: Bench regression check (>5% fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Run criterion benchmarks (flagship subset)
        # Runs only the three bounded flagship targets to keep the job under
        # 30 min wall-clock. `--warm-up-time 2 --measurement-time 3` reduces
        # criterion's per-bench budget while preserving statistical validity.
        #
        # INCLUDED: heat_1d (1D heat, N=1000), heat_2d (2D Strang, 400×400),
        #   graph_heat (Erdős–Rényi N=2000, three kernels).
        #
        # EXCLUDED (too heavy for nightly CI):
        #   diffusion6_simd      — SIMD micro-benchmark
        #   advdiff_2d           — large 2D advection-diffusion
        #   strang2d_parallel    — 800²×[1..16] thread sweep
        #   strang3d_parallel    — 120³=1.7 M nodes ×[1..16] thread sweep
        #   ns2d_aniso_parallel  — anisotropic 2D parallel sweep
        #   zeta_ladder          — heavy ζ-ladder sweep
        #   new_kernels{,2,3,4}  — kernel micro-benchmark suite
        #   cache_phase4         — cache-phase memory benchmark
        #
        # NOTE: Until baseline-v1_0_0.json benches{} is populated by the
        # maintainer, all median_ns values are absent and the comparison step
        # prints "baseline not populated — skipping regression check" and
        # exits 0 without failing the job.
        run: |
          cargo bench -p semiflow \
            --bench heat_1d --bench heat_2d --bench graph_heat \
            -- --warm-up-time 2 --measurement-time 3 --sample-size 10 \
            2>&1 | tee bench-output.txt
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Extract criterion medians and check regressions
        run: |
          python3 - << 'PYEOF'
          import json
          import re
          import sys

          BASELINE_PATH = "docs/perf/baseline-v1_0_0.json"
          BENCH_OUTPUT_PATH = "bench-output.txt"
          THRESHOLD_DEFAULT = 5.0  # percent

          # Load baseline — skip gracefully if not yet populated.
          try:
              with open(BASELINE_PATH) as f:
                  baseline = json.load(f)
          except FileNotFoundError:
              print("baseline not populated — skipping regression check")
              sys.exit(0)

          threshold = baseline.get("regression_threshold_pct", THRESHOLD_DEFAULT)

          # Map bench names to baseline entries (strip crate prefix for matching)
          # criterion reports: "test bench_name ... bench: N ns/iter (+/- M)"
          # We parse the human-readable criterion output line.
          # Pattern: "heat_1d/n=100/N=1000  time:   [lo  med  hi]"
          # criterion 0.5 stdout format (one line per bench):
          #   <name>  time:   [<lo> <med> <hi>]
          median_pattern = re.compile(
              r"^(.+?)\s+time:\s+\[.*?\s+([\d.]+)\s+(ns|µs|ms|s)\s+.*\]",
              re.MULTILINE,
          )

          SCALE = {"ns": 1.0, "µs": 1_000.0, "ms": 1_000_000.0, "s": 1_000_000_000.0}

          # Read bench output
          with open(BENCH_OUTPUT_PATH) as f:
              text = f.read()

          measured: dict[str, float] = {}
          for m in median_pattern.finditer(text):
              name = m.group(1).strip()
              value_ns = float(m.group(2)) * SCALE[m.group(3)]
              measured[name] = value_ns

          failures: list[str] = []
          skipped: list[str] = []
          checked: list[str] = []

          for key, entry in baseline["benches"].items():
              median_base = entry.get("median_ns")
              if median_base is None:
                  skipped.append(f"  SKIP {key} (baseline not yet populated)")
                  continue

              # Find the matching measured bench by suffix
              short = key.split("::")[-1]
              match = None
              for name, val in measured.items():
                  if short in name:
                      match = (name, val)
                      break

              if match is None:
                  failures.append(f"  MISSING {key} — not found in bench output")
                  continue

              name, val = match
              pct = (val - median_base) / median_base * 100.0
              if pct > threshold:
                  failures.append(
                      f"  REGRESSION {key}: {val:.0f} ns vs baseline {median_base:.0f} ns "
                      f"(+{pct:.1f}% > {threshold}% threshold)"
                  )
              else:
                  checked.append(
                      f"  OK        {key}: {val:.0f} ns vs baseline {median_base:.0f} ns "
                      f"({pct:+.1f}%)"
                  )

          print("=== Bench regression summary ===")
          for line in skipped:
              print(line)
          for line in checked:
              print(line)
          for line in failures:
              print(line)

          if failures:
              print(f"\nFAIL: {len(failures)} bench(es) regressed beyond {threshold}%.")
              sys.exit(1)
          elif skipped and not checked:
              print("\nNOTE: baseline not yet populated — skipping regression check.")
          else:
              print(f"\nPASS: no regressions beyond {threshold}%.")
          PYEOF

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench-output.txt
          retention-days: 30
