name: CI
# Toolchain note: all jobs use stable. rustfmt.toml was cleaned of nightly-only
# options (imports_granularity/group_imports removed in ADR-0182) so fmt now
# runs on stable. MSRV documented in Cargo.toml rust-version = "1.78" is for
# downstream users; CI pins stable (≥1.85) to keep clap_lex/edition2024 deps
# building correctly — edition 2024 was stabilised in 1.85 (rustc 1.96 on Artix).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      # `--all-features` is load-bearing, not cosmetic.
      #
      # Without it this job never saw the `#![cfg(feature = "slow-tests")]`
      # test files — 27 of the files carrying RELEASE_BLOCKING gates. Neither
      # did the `test` job below (`cargo test --workspace --release`, no
      # feature flags, no `-- --ignored`). Those files were therefore not
      # type-checked by ANY workflow: a renamed constructor or a changed
      # signature broke them while every PR stayed green, until a human
      # remembered to run `xtask test-full` by hand. Before v0.13.0-beta that
      # local run did not happen.
      #
      # clippy is a `check` build (no codegen), so covering them costs minutes
      # — a full `cargo test --no-run --release` over the same targets measured
      # >18 min on 12 cores, which is hours on a 2-vCPU hosted runner and far
      # too slow for every PR. Actually BUILDING and RUNNING the gates is the
      # `gate-sweep` job in flagship-gates.yml (nightly + release tags).
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      # MSRV applies to the core library only. Binding crates (semiflow-ffi,
      # semiflow-py, semiflow-wasm) depend on cbindgen/pyo3/wasm-bindgen which
      # require rustc > 1.78; their own MSRV is gated by those upstreams.
      - run: cargo +1.78 test -p semiflow --lib

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  suckless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- check-lints

  gate-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Asserts that every RELEASE_BLOCKING gate in properties.yaml is executed
      # by some workflow. Added because the hand-maintained `--test` list in
      # flagship-gates.yml drifted within a day of being written: review found
      # four binaries the first sweep had missed. Runs in seconds, stdlib only.
      - run: python3 scripts/check_gate_coverage.py

  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- doc-check

  changelog-check:
    # Advisory only on PRs/pushes: a version bump may happen before notes are written.
    # The hard block is enforced by the release-* workflows (no continue-on-error there).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- changelog-check

  # C-C3 fix: unsafe-scope is fast (exit 0 since allowlist+token-aware fix) and
  # MUST run on every push/PR to catch new unsafe outside the ADR-0019 allowlist.
  unsafe-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enforce unsafe scope (ADR-0019)
        run: cargo run -p xtask -- check-unsafe-scope

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Skip `advisories`: RUSTSEC-2026-0073 uses CVSS 4.0 which cargo-deny
          # <=0.16 cannot parse, causing a hard DB load error.  Re-enable once
          # upstream fixes the advisory entry or cargo-deny ships CVSS 4.0 support.
          command: check bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          # 80% floor. Excluded crates have dedicated integration jobs:
          #   semiflow-ffi  → ffi-smoke/ffi-build (C driver exercises extern "C" surface)
          #   semiflow-py   → py-smoke (Python driver)
          #   semiflow-wasm → wasm-test (Node/browser driver)
          #   xtask         → build-only tooling
          cargo llvm-cov --workspace --fail-under-lines 80 \
            --exclude semiflow-ffi \
            --exclude semiflow-py \
            --exclude semiflow-wasm \
            --exclude xtask

  ffi-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p semiflow-ffi --profile release-ffi

  ffi-headers-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- ffi-headers --check

  ffi-smoke:
    needs: ffi-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      # cl.exe requires the MSVC developer environment on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo run -p xtask -- ffi-smoke

  py-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install maturin
      - run: cargo run -p xtask -- py-build

  py-smoke:
    needs: py-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - run: cargo run -p xtask -- py-smoke

  # Run the 825-test fast Python suite on every push/PR to catch regressions
  # early.  The full cibuildwheel gate only fires at release time, which lets
  # stale-assertion bugs slip through.  This job mirrors the xtask py-smoke
  # setup (venv → maturin develop → pytest) but adds `-m "not slow"` to skip
  # the two slow integration tests and keeps the gate under ~3 min.
  py-test-fast:
    needs: py-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create venv and install deps (mirrors xtask py-smoke)
        run: |
          # rm -rf first: target/ is restored from the rust-cache archive, and
          # `python -m venv` on an existing dir reuses it and runs ensurepip
          # through that dir's recorded python3 symlink (see xtask create_venv).
          rm -rf target/py-fast-venv
          python -m venv target/py-fast-venv
          target/py-fast-venv/bin/pip install maturin numpy pytest
      - name: Build and install extension module (maturin develop)
        run: |
          VIRTUAL_ENV=$PWD/target/py-fast-venv \
          target/py-fast-venv/bin/maturin develop --profile release-ffi \
            -m crates/semiflow-py/Cargo.toml
      - name: Run fast Python suite (825 tests, 2 slow deselected)
        run: |
          target/py-fast-venv/bin/pytest crates/semiflow-py/tests \
            -m "not slow" -q

  wasm-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - run: cargo run -p xtask -- wasm-build
      # The `full` feature gates ~20 heavy WASM modules that no build path
      # enables, so nothing ever compiled them: `graph_magnus_wasm.rs` had
      # declared a submodule at a path that does not exist since it was
      # written, and the crate did not build with `--features full` at all.
      # A type-check is enough to keep it from rotting again.
      - name: Type-check the gated `full` WASM surface
        run: cargo check -p semiflow-wasm --features full --target wasm32-unknown-unknown

  wasm-test-node:
    needs: wasm-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Bootstrap rustup toolchain (macOS ARM workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup default stable
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cargo run -p xtask -- wasm-test

  wasm-test-chrome:
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - run: cargo run -p xtask -- wasm-test --chrome

  wasm-test-firefox:
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - uses: browser-actions/setup-firefox@v1
        with: { firefox-version: latest }
      - run: cargo run -p xtask -- wasm-test --firefox

  # D3 (v0.13.0): Binary-size gate — checks that all built artefacts are
  # within budget (<500 KB WASM, <1 MB FFI cdylib, <5 MB PyO3 cdylib).
  # Only audits artefacts that are already on disk; runs after all build jobs.
  binary-size-check:
    needs: [wasm-build, ffi-build, py-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # Restore wasm artefacts from wasm-build job via cache.
      # The wasm-build job and this job share the same Swatinem cache key,
      # so pkg-web/pkg-node are available after cache restore.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - name: Build WASM (size profile for measurement)
        run: cargo run -p xtask -- wasm-build --size
      - name: Build FFI cdylib
        run: cargo build -p semiflow-ffi --profile release-ffi
      - name: Report binary sizes
        run: cargo run -p xtask -- binary-size-check
