name: Release Crate (crates.io)

# crates.io publish was previously manual and drifted: the crate was stuck at
# 0.9.1-beta on crates.io while the repo advanced to 0.12.0-beta.  This workflow
# automates publish on v* tags, matching the PyPI (release-wheels.yml) and npm
# (release-wasm.yml) automation patterns already in place.
#
# Required secret: CRATES_IO_TOKEN — a crates.io API token with publish scope.
# Add it under Settings → Secrets and variables → Actions → New repository secret.
# Until the secret is set, tag pushes will fail at the publish step; the guards
# and tests still run and report correctly.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs for the same ref so a re-pushed tag waits for the first run
# to finish rather than attempting a parallel publish.  cancel-in-progress: false
# avoids cancelling a live cargo publish mid-flight.
concurrency:
  group: release-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  doc-check:
    name: Doc-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- doc-check

  publish:
    name: Publish semiflow to crates.io
    runs-on: ubuntu-latest
    needs: [doc-check]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Guard 1: tag version must match workspace Cargo.toml version.
      # Strips the leading 'v' from the git tag and compares to the
      # [workspace.package] version field.  Fails fast on mismatch to
      # prevent accidental publish of a stale version.
      # Skipped on workflow_dispatch when the ref is a branch (no tag present).
      - name: Guard 1 — verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -A5 '\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version:   $TAG"
          echo "Cargo version: $CARGO_VER"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "ERROR: tag '$GITHUB_REF_NAME' does not match Cargo.toml version '$CARGO_VER'"
            exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Guard 2: idempotency — skip (exit 0, do not fail) if this exact version
      # is already published on crates.io.  Prevents errors when re-running a
      # workflow for an existing tag or when a tag is re-pushed.
      # Uses the crates.io JSON API; jq is pre-installed on ubuntu-latest runners.
      - name: Guard 2 — idempotency check (skip if already published)
        id: idempotency
        run: |
          CARGO_VER=$(grep -A5 '\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Checking crates.io for semiflow@$CARGO_VER ..."
          FOUND=$(curl -s -H "User-Agent: semiflow-ci" \
            "https://crates.io/api/v1/crates/semiflow" | \
            jq -r --arg ver "$CARGO_VER" \
              '[ .versions[]? | select(.num == $ver) ] | length' 2>/dev/null || echo "0")
          if [ "$FOUND" != "0" ] && [ -n "$FOUND" ]; then
            echo "semiflow@$CARGO_VER already published on crates.io — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK — semiflow@$CARGO_VER not yet published."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Test gate: run the core library test suite before publish.
      # Mirrors ci.yml test job scoped to the core crate.
      # A test failure blocks the publish step — consistent with the
      # publish-on-tests policy used by release-wheels.yml and release-wasm.yml.
      - name: Run core tests (cargo test -p semiflow --release)
        if: steps.idempotency.outputs.skip != 'true'
        run: cargo test -p semiflow --release

      # Publish the core semiflow crate only.
      # The binding crates are distributed through other channels and all carry
      # publish = false in their Cargo.toml:
      #   semiflow-ffi  → GitHub Releases (C ABI cdylib)
      #   semiflow-py   → PyPI via release-wheels.yml
      #   semiflow-wasm → npm via release-wasm.yml
      # Using -p semiflow scopes this step to the core crate regardless.
      - name: Publish to crates.io
        if: steps.idempotency.outputs.skip != 'true'
        run: cargo publish -p semiflow --token ${{ secrets.CRATES_IO_TOKEN }}
