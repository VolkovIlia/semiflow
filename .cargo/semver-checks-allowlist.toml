# ⚠ INERT — THIS FILE IS NOT READ BY ANYTHING. Audited 2026-08-17.
#
# Two independent reasons, either one sufficient:
#   1. `cargo-semver-checks` does not read `.cargo/semver-checks-allowlist.toml`.
#      It has no such config path; suppressions go in `[package.metadata.
#      semver-checks]` in the crate's Cargo.toml, or via CLI flags.
#      `.github/workflows/semver.yml` runs a bare
#      `cargo semver-checks check-release -p semiflow` and passes no allowlist.
#   2. The `[package.semiflow-core]` key below names a package that no longer
#      exists — the crate was renamed `semiflow-core` -> `semiflow` in the
#      SemiFlow rebrand, so the section would not match even if it were read.
#
# The key was deliberately NOT renamed to `semiflow`: doing so would make the
# file look wired up while it stayed just as inert. DO NOT add entries here
# expecting them to suppress a semver failure — they will not.
#
# Kept as the historical record of the v1.x -> v2.0.0 (Wave 3) intentional
# breaking changes, which are the entries below.
#
# Reference: docs/adr/0043-state-trait-three-layer-split.md

[package.semiflow-core]

# Breaking: `Clone` removed as supertrait of `State<F>`.
# Rationale: ADR-0043 §3 — clone-free zero-allocation Banach interface.
# Migration: add explicit `+ Clone` bound where needed (see ADR-0043 §7).
[[package.semiflow-core.allow]]
lint = "trait_removed_supertrait"
path = "pub trait State"

# Breaking: `axpy` inherent method removed from `State<F>` (was trait method).
# v1.x `axpy(&alpha, &x)` → v2.0 `axpy_into(alpha, &x)`.
# Rationale: ADR-0043 §3.1 — signature aligned with in-place mutation contract.
[[package.semiflow-core.allow]]
lint = "trait_method_removed"
path = "pub trait State::axpy"

# Breaking: `scale` inherent method removed from `State<F>`.
# v1.x `scale(&k)` → v2.0 `scale_into(k)`.
[[package.semiflow-core.allow]]
lint = "trait_method_removed"
path = "pub trait State::scale"

# Breaking: `zeroed_like` inherent method removed from `State<F>`.
# v1.x `zeroed_like()` → v2.0 `zero_into()` (in-place) + caller-side `clone`.
# Rationale: ADR-0043 §3.2 — eliminates mandatory allocation in trait contract.
[[package.semiflow-core.allow]]
lint = "trait_method_removed"
path = "pub trait State::zeroed_like"
