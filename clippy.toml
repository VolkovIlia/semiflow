msrv = "1.81"
cognitive-complexity-threshold = 25
type-complexity-threshold = 250
too-many-arguments-threshold = 6
too-many-lines-threshold = 50
# Proper names used in prose (the crate docs include README.md); ".." keeps the defaults.
doc-valid-idents = ["SemiFlow", "PyPI", "SciPy", "NumPy", "CPython", "x86_64", ".."]

# ADR-0200: semiflow's numerics must not depend on whether num-traits/num-complex
# use the platform math library (std) or libm (no_std). Denied only in
# crates/semiflow (non-test) and crates/semiflow-nostd-check; allowed elsewhere via
# [workspace.lints.clippy] disallowed_methods = "allow".
