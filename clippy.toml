    { path = "num_traits::float::Float::exp", reason = "use SemiflowFloat::libm_* (bit-identical std/no_std, ADR-0200)" },
    { path = "num_traits::float::Float::exp2", reason = "use SemiflowFloat::libm_* (bit-identical std/no_std, ADR-0200)" },
